---
- name: Backup Aruba Switch Config
  hosts: all
  gather_facts: false

  vars_files:
    - ../inventory/vault.yml

  tasks:
    - name: Backup running-config via TFTP
      ansible.netcommon.cli_command:
        command: "copy running-config tftp {{ tftp_server }} {{ inventory_hostname }}-config.cfg"
      register: switch_config

    - name: Save config locally
      copy:
        content: "{{ switch_config.stdout }}"
        dest: "{{ playbook_dir }}/../backups/{{ inventory_hostname }}-running-config.txt"
        mode: "0600"
